name: Bug report
description: Report a reproducible, sanitized application problem
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Do not include passwords, tokens, credentials, raw profiles, full firewall dumps, real client MAC/IP/hostnames or personal paths. Report vulnerabilities privately through SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: AAG release or commit
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Ubuntu, kernel, NetworkManager and Wi-Fi chipset/driver versions
      description: Include hardware model/family, never serial numbers or unique device identifiers.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Current mode
      options: ['OFF', 'Internet', 'Local-only', 'Unknown / failed transition']
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized aag-hotspot doctor output
      description: Review and remove personal identifiers before posting. Do not run --show-secrets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and cleanup
      options:
        - label: I reviewed this report and removed secrets and private identifiers.
          required: true
        - label: I recorded whether the hotspot could be returned to OFF.
          required: true
