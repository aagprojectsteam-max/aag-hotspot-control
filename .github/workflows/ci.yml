name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hardware-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Distribution test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 desktop-file-utils shellcheck
      - name: Syntax, desktop entry and fixed privilege scope
        run: /usr/bin/python3 scripts/check-static.py
      - name: Unit and regression tests (mock hardware only)
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Public-tree and full-history privacy scan
        run: |
          /usr/bin/python3 scripts/privacy_scan.py
          /usr/bin/python3 scripts/privacy_scan.py --history
      - name: Checksum-pinned Gitleaks full-history scan
        run: |
          curl --fail --location --retry 3 --max-time 90 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/aag-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/aag-gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/aag-gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact
      - name: Build and test the extracted release artifact
        run: |
          /usr/bin/python3 scripts/build_release.py
          /usr/bin/python3 scripts/test_artifact.py dist/aag-hotspot-control-v0.2.0.tar.gz
          cd dist
          sha256sum --check SHA256SUMS
      - name: Reproducible build
        run: |
          cp dist/SHA256SUMS /tmp/aag-first-checksums
          /usr/bin/python3 scripts/build_release.py
          diff -u /tmp/aag-first-checksums dist/SHA256SUMS
          git diff --exit-code
